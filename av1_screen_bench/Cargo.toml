[package]
name = "rustadmin-av1-screen-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hbb_common = { path = "../../hbb_common" }
scrap = { path = "../../rustadmin/libs/scrap", features = ["hwcodec"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
hwcodec = { path = "../../hwcodec" }
